name: ETHER SERVER AUTO-SETUP

on:
  workflow_dispatch:
    inputs:
      ts_api_token:
        description: "Tailscale API Token (tskey-api-...)"
        required: true
        default: "tskey-api-kUcAaf5P9r11CNTRL-R3MjH1c372dtZxXTi5sR1dYwad7x1XTB7"

permissions:
  contents: read
  actions: write

jobs:
  full-setup:
    runs-on: windows-latest
    timeout-minutes: 360

    env:
      RDP_USER: sedor
      RDP_PASS: Mariya@1981
      TAILNET: "seadorhassan@gmail.com"
      MUMU_MGR: 'C:\Program Files\Netease\MuMuPlayer\nx_main\MuMuManager.exe'

    steps:
    # ---------------- 1. GENERATE AUTH KEY FIRST ----------------
    - name: Generate Tailscale Auth Key
      id: gen_key
      shell: cmd
      run: |
        curl -X POST "https://api.tailscale.com/api/v2/tailnet/seadorhassan@gmail.com/keys" ^
        -H "Authorization: Bearer ${{ inputs.ts_api_token }}" ^
        -H "Content-Type: application/json" ^
        -d "{\"capabilities\":{\"devices\":{\"create\":{\"reusable\":false,\"ephemeral\":true,\"preauthorized\":true}}},\"expirySeconds\":3600}" > key_res.json

    - name: Set Auth Key to Env
      shell: pwsh
      run: |
        $res = Get-Content key_res.json | ConvertFrom-Json
        if ($res.key) {
          echo "TS_AUTH_KEY=$($res.key)" >> $env:GITHUB_ENV
          Write-Host "Success: Auth Key Generated."
        } else {
          cat key_res.json
          throw "Auth Key generation failed!"
        }

    # ---------------- 2. INSTALL & LOGIN TAILSCALE ----------------
    - name: Install and Start Tailscale
      shell: pwsh
      run: |
        $exe = "$env:ProgramFiles\Tailscale\tailscale.exe"
        if (-not (Test-Path $exe)) {
          Invoke-WebRequest https://pkgs.tailscale.com/stable/tailscale-setup-1.82.0-amd64.msi -OutFile tailscale.msi
          Start-Process msiexec.exe -ArgumentList "/i tailscale.msi /quiet /norestart" -Wait
        }
        Start-Service Tailscale
        Start-Sleep 10
        & $exe up --authkey "$env:TS_AUTH_KEY" --hostname "ETHER RUNNER v3 FOR ADB-${{ github.run_id }}"
        
        $ip = & $exe ip -4 | Select-Object -First 1
        echo "TS_IP=$ip" >> $env:GITHUB_ENV
        Write-Host "Tailscale IP: $ip"

    # ---------------- 3. SETUP PROTON WIREGUARD VPN (SPLIT TUNNEL) ----------------
    - name: Setup Proton WireGuard VPN
      shell: pwsh
      run: |
        # Install WireGuard CLI via Choco
        choco install wireguard -y

        # Define Proton WireGuard Config with Split-Tunneling
        # Tailscale IP Subnet (100.64.0.0/10) is excluded from AllowedIPs so RDP doesn't disconnect!
        $protonConfig = @"
        [Interface]
        PrivateKey = SAWNX4IiJZvBhHlJAIu84cTBLRMEkIlGkkiqPBSwbk0=
        Address = 10.2.0.2/32
        DNS = 10.2.0.1

        [Peer]
        PublicKey = CWQjPwtCiy4zb/nUbj5VhtxLHMWY6wYS02PaayGdi3c=
        AllowedIPs = 0.0.0.0/1, 128.0.0.0/2, 192.0.0.0/3, 224.0.0.0/4, 100.0.0.0/11, 100.128.0.0/9
        Endpoint = 185.159.156.109:51820
        PersistentKeepalive = 25
        "@

        Set-Content -Path "C:\proton.conf" -Value $protonConfig

        # Install & Start WireGuard Tunnel Service
        $wireguardPath = "C:\Program Files\WireGuard\wireguard.exe"
        Start-Process -FilePath $wireguardPath -ArgumentList "/installtunnelservice C:\proton.conf" -Wait
        Start-Sleep 5

        # Check public IP to confirm VPN activation
        $currentIp = (Invoke-RestMethod -Uri "https://api.ipify.org")
        Write-Host "Current Public IP (Proton VPN Active): $currentIp"

    # ---------------- 4. RDP & ENVIRONMENT ----------------
    - name: Enable RDP
      shell: pwsh
      run: |
        $sec = ConvertTo-SecureString $env:RDP_PASS -AsPlainText -Force
        if (-not (Get-LocalUser $env:RDP_USER -EA SilentlyContinue)) {
          New-LocalUser $env:RDP_USER -Password $sec
          Add-LocalGroupMember Administrators $env:RDP_USER
          Add-LocalGroupMember "Remote Desktop Users" $env:RDP_USER
        }
        Set-ItemProperty "HKLM:\System\CurrentControlSet\Control\Terminal Server" -Name fDenyTSConnections -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"

    
    # ---------------- 6. KEEP ALIVE ----------------
    - name: Keep alive
      shell: pwsh
      run: |
        Write-Host "Connect RDP to: $env:TS_IP"
        Start-Sleep -Seconds 21600
